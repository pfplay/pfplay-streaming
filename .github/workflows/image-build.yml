name: Build image (streaming)

# 버전별 멀티 아키텍처(amd64 · arm64) 이미지를 GHCR 에 올리기만 한다. 배포는 하지 않는다.
# 어느 환경이 어느 버전을 쓸지는 pfplay-platform 의 deploy/oci/streaming-versions.env 가 정한다.
#   master push   → ghcr.io/pfplay/pfplay-streaming:master · :sha-<commit>
#   v* 태그 push  → ghcr.io/pfplay/pfplay-streaming:<tag> · :sha-<commit>
#   수동 실행     → 입력한 ref(태그 · 브랜치)를 같은 규칙으로 빌드 (워크플로 추가 전에 만든 태그용)
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 빌드할 태그 또는 브랜치 (예 v1.0.0)
        required: true

env:
  IMAGE: ghcr.io/pfplay/pfplay-streaming

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Save digest
        run: |
          echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.arch }}
          git rev-parse HEAD > commit

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: |
            digest-${{ matrix.arch }}
            commit
          retention-days: 1

  manifest:
    name: Tag multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tags
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          # 브랜치 · 태그 이름을 그대로 이미지 태그로 쓴다 (master, v1.0.1 …).
          name="${REF//\//-}"
          docker buildx imagetools create -t "$IMAGE:$name" -t "$IMAGE:sha-$(cat commit)" \
            "$IMAGE@$(cat digest-amd64)" "$IMAGE@$(cat digest-arm64)"
          docker buildx imagetools inspect "$IMAGE:$name"
