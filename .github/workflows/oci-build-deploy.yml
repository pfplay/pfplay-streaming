name: OCI build & deploy (streaming)

# 브랜치는 master 하나, 환경은 태그로 올린다. 한 번 빌드한 이미지를 dev → stg → prod 로 그대로 승격한다.
#   master push        → :master · :sha-<commit> 빌드 → dev 의 pytube 교체
#   v* 태그 push       → :<tag> · :sha-<commit> 빌드 → stg 의 pytube 교체
#   수동 실행(prod)     → 이미 있는 :<tag> 를 prod 의 pytube 로 교체 (GitHub Environment oci-prod 승인)
# pytube 서비스 정의는 pfplay-platform 의 deploy/oci 에 있고, 여기서는 그 서비스만 바꾼다.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: 배포 환경
        type: choice
        options: [stg, prod]
        required: true
      tag:
        description: 배포할 이미지 태그 (예 v1.0.1)
        required: true

env:
  IMAGE: ghcr.io/pfplay/pfplay-streaming

jobs:
  build:
    name: Build ${{ matrix.arch }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Save digest
        run: echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          retention-days: 1

  manifest:
    name: Tag multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="$GITHUB_REF_NAME"; else name=master; fi
          docker buildx imagetools create -t "$IMAGE:$name" -t "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE@$(cat digest-amd64)" "$IMAGE@$(cat digest-arm64)"
          # 배포는 태그 push 면 그 태그, master push 면 커밋 고정 태그로 한다.
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$name" >> "$GITHUB_OUTPUT"; else echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"; fi

  deploy:
    name: Deploy pytube to OCI (${{ github.event_name == 'workflow_dispatch' && inputs.env || (github.ref_type == 'tag' && 'stg' || 'dev') }})
    needs: manifest
    if: always() && (needs.manifest.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, "${{ (github.event_name == 'workflow_dispatch' && inputs.env == 'prod') && 'oci-prod' || 'oci-dev' }}"]
    environment: oci-${{ github.event_name == 'workflow_dispatch' && inputs.env || (github.ref_type == 'tag' && 'stg' || 'dev') }}
    permissions:
      packages: read
    concurrency:
      group: oci-pytube-${{ github.event_name == 'workflow_dispatch' && inputs.env || (github.ref_type == 'tag' && 'stg' || 'dev') }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (github.ref_type == 'tag' && 'stg' || 'dev') }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.manifest.outputs.tag }}
    steps:
      - name: Replace pytube
        run: |
          script="/opt/pfplay/$TARGET/deploy.sh"
          [ -x "$script" ] || { echo "$script not found — deploy pfplay-platform to $TARGET first" >&2; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          "$script" "$TARGET" pytube "$TAG"
