<html>
    <head>
        <title>Hls.js demo - basic usage</title>
    </head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
        <center>
            <h1>Hls.js demo - basic usage</h1>
                <video height="600" id="video" controls></video>
        </center>
        <script>
            var video = document.getElementById('video');

            if (Hls.isSupported()) {
                var hls = new Hls({
                    debug: true,
            });
            hls.loadSource('video/PJ0u5c9EF1E.m3u8');
            hls.attachMedia(video);
            hls.on(Hls.Events.FRAG_CHANGED, (evt, data) => {
                console.log("debug evt", evt, data.frag.programDateTime);
                const {
                    frag: { programDateTime }
                } = data;
                console.log('programDateTime', programDateTime);
            })};
        </script>
    </body>
</html>
